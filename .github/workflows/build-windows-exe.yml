name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pyinstaller PyQt6 Pillow

      - name: Build JustDraw.exe
        run: python build_exe.py

      - name: Write SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/JustDraw.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist/JustDraw.exe.sha256 -Value $hash

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: JustDraw-windows-exe
          path: |
            dist/JustDraw.exe
            dist/JustDraw.exe.sha256
          if-no-files-found: error

      - name: Publish release assets
        id: draft_release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/JustDraw.exe
            dist/JustDraw.exe.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Publish drafted release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ contains(github.ref_name, '-') }}
          RELEASE_ID: ${{ steps.draft_release.outputs.id }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $isPrerelease = $env:IS_PRERELEASE -eq 'true'
          $body = @{ draft = $false; prerelease = $isPrerelease } | ConvertTo-Json
          Invoke-RestMethod `
            -Method Patch `
            -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" `
            -Headers $headers `
            -ContentType "application/json" `
            -Body $body
